<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría | Plataforma Logística</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-corporate { color: #0a407e; }
        .bg-corporate { background-color: #0a407e; }
        .border-corporate { border-color: #0a407e; }
        .btn-outline { border: 1px solid #0a407e; color: #0a407e; }
        .btn-outline:hover { background-color: #f0f7ff; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-slate-800 flex flex-col">

    <!-- Encabezado Corporativo -->
    <header class="border-b border-gray-200 py-4 px-8 flex justify-between items-center bg-white shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-corporate rounded-full flex items-center justify-center text-white font-bold text-xl">B</div>
            <div>
                <h1 class="text-xl font-light text-corporate tracking-wider">BRIZO</h1>
                <p class="text-[10px] text-gray-500 uppercase tracking-widest">Módulo de Auditoría</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></div>
            <span class="text-sm font-bold text-red-600 uppercase tracking-wider">Aduanas y Control</span>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 flex justify-center items-start p-8 mt-4">
        <div class="bg-white p-8 border border-gray-200 border-t-4 border-t-red-600 shadow-sm w-full max-w-lg">
            
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Bloqueo Selectivo de Carga</h2>
            <p class="text-gray-600 text-sm mb-6">Emisión de alertas rojas para anular espacios u ofertas específicas sin detener todo el contenedor.</p>

            <div class="space-y-5">
                <div>
                    <div class="flex justify-between items-end mb-2">
                        <label class="block text-sm font-semibold text-gray-700">1. Seleccione la Puja / Fracción Activa</label>
                        <button onclick="cargarPujas()" class="text-xs text-corporate hover:underline font-medium">↻ Actualizar Lista</button>
                    </div>
                    <select id="pujaId" class="w-full px-4 py-3 border border-gray-300 rounded focus:ring-2 focus:ring-red-500 outline-none bg-gray-50 text-sm">
                        <option value="">Cargando ofertas del puerto...</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">2. Motivo de Intervención</label>
                    <input type="text" id="motivo" placeholder="Ej. Documentación incompleta, inspección física..." class="w-full px-4 py-3 border border-gray-300 rounded focus:ring-2 focus:ring-red-500 outline-none text-sm">
                </div>
                
                <button onclick="emitirBloqueo()" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded font-bold transition-colors shadow-md mt-2 flex justify-center items-center gap-2">
                    Ejecutar Retención Aduanera
                </button>
            </div>

            <div id="resultado" class="mt-4 text-sm font-medium hidden"></div>
        </div>
    </main>

    <script>
        async function cargarPujas() {
            const select = document.getElementById('pujaId');
            select.innerHTML = '<option value="">Actualizando en vivo...</option>';
            try {
                const res = await fetch('http://localhost:3001/api/pujas');
                const pujas = await res.json();
                
                if(pujas.length === 0) {
                    select.innerHTML = '<option value="" disabled selected>No hay pujas activas para bloquear.</option>';
                    return;
                }

                select.innerHTML = '<option value="" disabled selected>Elija una oferta específica...</option>';
                pujas.forEach(p => {
                    select.innerHTML += `<option value="${p.id}">Puja ${p.id} | ${p.contenedorId} | Monto: $${p.monto}</option>`;
                });
            } catch (error) {
                select.innerHTML = '<option value="">Error al conectar con el servidor.</option>';
            }
        }

        async function emitirBloqueo() {
            const select = document.getElementById('pujaId');
            const pujaId = select.value;
            const motivo = document.getElementById('motivo').value || 'Inspección de rutina';
            const btn = document.querySelector('button');
            const res = document.getElementById('resultado');

            if (!pujaId) return alert('Debe seleccionar una oferta específica de la lista.');

            btn.textContent = 'Procesando intervención...';
            btn.disabled = true;

            try {
                const response = await fetch('http://localhost:3002/emitir-bloqueo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pujaId, motivo })
                });
                const data = await response.json();
                
                res.className = 'mt-4 text-sm font-bold text-red-700 block p-4 bg-red-50 rounded border border-red-200';
                res.textContent = `✓ ${data.mensaje}`;
                
                // Limpiar form
                document.getElementById('motivo').value = '';
                cargarPujas();
            } catch (error) {
                res.className = 'mt-4 text-sm font-bold text-gray-700 block p-4 bg-gray-200 rounded border border-gray-300';
                res.textContent = '✗ Error de conexión con el servidor aduanero.';
            } finally {
                btn.innerHTML = 'Ejecutar Retención Aduanera';
                btn.disabled = false;
            }
        }

        // Cargar al iniciar
        document.addEventListener('DOMContentLoaded', cargarPujas);
    </script>
</body>
</html>
